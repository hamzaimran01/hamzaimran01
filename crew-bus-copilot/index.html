<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crew Bus Copilot</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="app-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="3.5"/><path d="M4 11h16"/><circle cx="8" cy="20" r="1.4"/><circle cx="16" cy="20" r="1.4"/></svg>
      </span>
      <div class="brand-text">
        <div class="title">Crew Bus Copilot</div>
        <div class="subtitle">Frankfurt Airport · crew transport demo</div>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Pages">
      <button class="tab" role="tab" data-tab-btn="input"><span class="tab-n">1</span>Tasks</button>
      <button class="tab" role="tab" data-tab-btn="plan"><span class="tab-n">2</span>Plan <span class="badge openBadge" hidden></span></button>
      <button class="tab" role="tab" data-tab-btn="live"><span class="tab-n">3</span>Live map <span class="live-dot" aria-hidden="true"></span></button>
      <button class="tab" role="tab" data-tab-btn="overview"><span class="tab-n">4</span>Results</button>
    </nav>
    <div class="top-actions">
      <button class="search-btn" data-action="search" aria-label="Search or type a disruption">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="search-ph">Search or type a disruption</span><kbd class="kbd-mod">⌘</kbd><kbd>K</kbd>
      </button>
      <div class="bell-wrap">
        <button class="icon-btn" id="bellBtn" data-action="bell" aria-label="Alerts" aria-expanded="false">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4l2-2z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
          <span class="bell-count" id="bellCount" hidden></span>
        </button>
        <div class="alert-panel" id="alertPanel" hidden></div>
      </div>
      <button class="icon-btn" data-action="help" aria-label="What is this?">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><circle cx="12" cy="17" r=".6"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <section id="view-input" class="view" role="tabpanel"></section>
  <section id="view-plan" class="view" role="tabpanel"></section>
  <section id="view-live" class="view" role="tabpanel"></section>
  <section id="view-overview" class="view" role="tabpanel"></section>
</main>

<footer class="footer">
  <span class="wc-note">Planning use only, no performance monitoring of drivers.</span>
  <span>Drivers appear only as pseudonymous IDs (D-01 …). Crew tasks and buses are synthetic; the airport map is schematic.</span>
</footer>

<nav class="tabbar" role="tablist" aria-label="Pages">
  <button role="tab" data-tab-btn="input"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></svg><span>Tasks</span></button>
  <button role="tab" data-tab-btn="plan"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h6M7 13h10M7 17h4"/></svg><span>Plan</span><span class="badge openBadge" hidden></span></button>
  <button role="tab" data-tab-btn="live"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span>Live map</span></button>
  <button role="tab" data-tab-btn="overview"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Results</span></button>
</nav>

<div id="alertStack" class="alert-stack" aria-live="polite"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="palette" class="overlay" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Search and commands">
    <div class="k-input-row">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="kInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search tasks, flights, buses — or type “LH400 delayed 30 min”" aria-label="Search">
      <kbd>esc</kbd>
    </div>
    <ul id="kList" class="k-list" role="listbox"></ul>
  </div>
</div>

<div id="welcome" class="overlay sheet-overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Introduction">
    <button class="icon-btn sheet-close" data-action="welcomeClose" aria-label="Close">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="sheet-body"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="parser.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
